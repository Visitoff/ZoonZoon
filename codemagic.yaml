workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic  # <-- Name of your App Store Connect API key in Codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "kotlin"
          include: true
      cancel_previous_builds: true

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ZoonZoon  # <-- Your bundle ID
      vars:
        XCODE_PROJECT: "iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        APP_ID: 1595186051
      xcode: latest

    scripts:
      - name: Build Kotlin/Native framework
        script: |
          cd $CM_BUILD_DIR
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

      - name: Set up code signing settings on Xcode project
        script: |
          cd $CM_BUILD_DIR/iosApp
          xcode-project use-profiles

      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd $CM_BUILD_DIR/iosApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA for distribution
        script: |
          cd $CM_BUILD_DIR/iosApp
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your@email.com  # <-- Replace with your email
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
