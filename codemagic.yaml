workflows:
  ios-kmm-workflow:
    name: iOS KMM Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: zonozonoz

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "kotlin"
          include: true
      cancel_previous_builds: true

    environment:
      vars:
        XCODE_PROJECT: "iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.ZoonZoon"
        APP_ID: 1595186051
      xcode: latest

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize

          # Fetch provisioning profile and certificate.
          # --create will generate a new cert if private key is missing.
          # NOTE: If you already have 3 distribution certs in Apple Portal, delete one first.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          # Apply signing settings to the Xcode project
          PROJECT_PATH=$(find "$CM_BUILD_DIR/iosApp" -name "*.xcodeproj" | head -n 1)
          xcode-project use-profiles --project "$PROJECT_PATH"

      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          set -x
          cd $CM_BUILD_DIR/iosApp
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA for distribution
        script: |
          cd $CM_BUILD_DIR/iosApp
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty > xcode_raw.log 2>&1 || {
              echo "==============================================="
              echo "❌ XCODE BUILD FAILED. LOG EXCERPT:"
              echo "==============================================="
              grep -iE -A 2 -B 2 "error:|permission denied|no such file|command not found" xcode_raw.log | tail -n 50
              exit 1
            }

    artifacts:
      - iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/iosApp/xcode_raw.log

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
