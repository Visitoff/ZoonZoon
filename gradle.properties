#Kotlin
kotlin.code.style=official
# Keep Gradle + Kotlin daemon small so linkReleaseFramework can take 4G on Codemagic M2 (8 GB).
kotlin.daemon.jvmargs=-Xmx1024M
# Windows cannot compile iOS cinterop targets — suppress expected warnings
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization.nowarn=true
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true
# linkReleaseFrameworkIosArm64 runs in a separate JVM; default heap OOMs on Compose.
kotlin.native.jvmArgs=-Xmx4G

#Gradle
org.gradle.jvmargs=-Xmx1536M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.workers.max=1

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
