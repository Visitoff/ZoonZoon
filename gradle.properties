#Kotlin
kotlin.code.style=official
# Native compiler daemon + Gradle together OOM on Codemagic M2 (8 GB).
# Run the linker in the Gradle JVM and give that one process the heap.
kotlin.native.disableCompilerDaemon=true
kotlin.daemon.jvmargs=-Xmx256M
# Windows cannot compile iOS cinterop targets — suppress expected warnings
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization.nowarn=true
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true
# Caches inflate peak RAM during linkReleaseFrameworkIosArm64.
kotlin.native.cacheKind=none

#Gradle
org.gradle.jvmargs=-Xmx5G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.workers.max=1

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
